[pytest]
testpaths = tests
markers =
    heavy: exercises a real 34 MB bitstream (smoke self-tests, c2 round-trip,
        calibration) -- excluded from the fast gate scope (P0.T42, ~90 s
        budget), included in full/all.
    gate_proof: real commits/pushes through the real installed gate
        (P0.T43's own proof) -- excluded from every automatic scope
        (fast/full/all), since each such commit/push recursively re-runs
        the gate itself. Run explicitly: pytest tests/test_gate_blocks.py.
